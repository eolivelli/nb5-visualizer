description: |
  Demo CQL key-value workload for the NoSQLBench 5 Visualizer.
  Based on the bundled cql_keyvalue baseline, with scenario tag filters that
  match the block names, and an optional "bad" op that fails at execution time
  so error metrics show up in the report (enable with the errors scenario).

scenarios:
  default:
    schema: run driver=cql tags==block:schema threads==1 cycles==UNDEF
    rampup: run driver=cql tags==block:rampup cycles===TEMPLATE(rampup-cycles,10000) threads=auto
    main: run driver=cql tags=='block:main_.*' cycles===TEMPLATE(main-cycles,30000) threads=auto
  witherrors:
    schema: run driver=cql tags==block:schema threads==1 cycles==UNDEF
    rampup: run driver=cql tags==block:rampup cycles===TEMPLATE(rampup-cycles,10000) threads=auto
    main: run driver=cql tags=='block:(main_.*|errors)' cycles===TEMPLATE(main-cycles,30000) threads=auto

bindings:
  seq_key: Mod(TEMPLATE(keycount,1000000)); ToString() -> String
  seq_value: Hash(); Mod(TEMPLATE(valuecount,1000000000)); ToString() -> String
  rw_key: TEMPLATE(keydist,Uniform(0,1000000)->int); ToString() -> String
  rw_value: Hash(); TEMPLATE(valdist,Uniform(0,1000000000)->int); ToString() -> String

blocks:
  schema:
    ops:
      create_keyspace:
        raw: |
          create keyspace if not exists TEMPLATE(keyspace,baselines)
          WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 'TEMPLATE(rf,1)'}
          AND durable_writes = true;
      create_table:
        raw: |
          create table if not exists TEMPLATE(keyspace,baselines).TEMPLATE(table,keyvalue) (
          key text,
          value text,
          PRIMARY KEY (key)
          );
  rampup:
    params:
      cl: TEMPLATE(write_cl,LOCAL_QUORUM)
    ops:
      rampup_insert:
        prepared: |
          insert into TEMPLATE(keyspace,baselines).TEMPLATE(table,keyvalue)
          (key, value)
          values ({seq_key},{seq_value});
  main_read:
    params:
      ratio: 5
      cl: TEMPLATE(read_cl,LOCAL_QUORUM)
    ops:
      main_select:
        prepared: |
          select * from TEMPLATE(keyspace,baselines).TEMPLATE(table,keyvalue) where key={rw_key};
  main_write:
    params:
      ratio: 5
      cl: TEMPLATE(write_cl,LOCAL_QUORUM)
    ops:
      main_insert:
        prepared: |
          insert into TEMPLATE(keyspace,baselines).TEMPLATE(table,keyvalue)
          (key, value) values ({rw_key},{rw_value});
  errors:
    params:
      ratio: 1
    ops:
      bad_select:
        raw: |
          select * from TEMPLATE(keyspace,baselines).TEMPLATE(table,keyvalue) where key = = '{rw_key}';
