name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and unit test
        run: mvn -B verify
      - name: Upload jars
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            nb5-visualizer-core/target/nb5-visualizer-core-*.jar
            nb5-visualizer-tui/target/nb5-visualizer-tui-*.jar

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Full Cassandra 5 + nb5 integration test
        run: mvn -B verify -Pdocker-it
